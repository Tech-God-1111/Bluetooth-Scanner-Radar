<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Scanner - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a1929;
            color: #e6f1ff;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #1e4976;
            margin-bottom: 30px;
        }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon { font-size: 2em; color: #4dabf7; }
        .logo-text { font-size: 1.8em; font-weight: bold; color: #4dabf7; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a {
            color: #e6f1ff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s;
        }
        .nav-links a:hover { background: rgba(77, 171, 247, 0.1); }
        .nav-links .active { background: #4dabf7; color: #0a1929; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
        .panel {
            background: rgba(30, 73, 118, 0.3);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #1e4976;
        }
        .panel-title {
            font-size: 1.3em;
            color: #4dabf7;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .device-table {
            width: 100%;
            border-collapse: collapse;
        }
        .device-table th {
            text-align: left;
            padding: 12px;
            background: rgba(77, 171, 247, 0.1);
            color: #4dabf7;
            border-bottom: 2px solid #1e4976;
        }
        .device-table td {
            padding: 12px;
            border-bottom: 1px solid #1e4976;
        }
        .device-table tr:hover { background: rgba(77, 171, 247, 0.05); }
        .device-address {
            font-family: monospace;
            font-size: 0.9em;
            color: #a3d5ff;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-connected { background: rgba(33, 150, 243, 0.2); color: #2196f3; }
        .status-paired { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #4dabf7; color: #0a1929; }
        .btn-success { background: #4caf50; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: rgba(30, 73, 118, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid #1e4976;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #4dabf7;
            margin: 10px 0;
        }
        .history-panel {
            max-height: 400px;
            overflow-y: auto;
        }
        .history-item {
            padding: 15px;
            border-bottom: 1px solid #1e4976;
        }
        .history-time {
            color: #4dabf7;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .device-type-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            text-align: center;
            margin-right: 10px;
            border-radius: 50%;
            background: rgba(77, 171, 247, 0.1);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #4dabf7;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #78909c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">📡</div>
                <div class="logo-text">Bluetooth Scanner</div>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/dashboard" class="active">Dashboard</a>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div>Connected Devices</div>
                <div class="stat-value" id="connectedCount">0</div>
                <div>Active now</div>
            </div>
            <div class="stat-box">
                <div>Paired Devices</div>
                <div class="stat-value" id="pairedCount">0</div>
                <div>All known</div>
            </div>
            <div class="stat-box">
                <div>Total Scans</div>
                <div class="stat-value" id="totalScans">0</div>
                <div>Sessions</div>
            </div>
            <div class="stat-box">
                <div>System</div>
                <div class="stat-value" id="systemName">WIN</div>
                <div>Platform</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="scanDevices()">
                <span>🔍</span> Scan Now
            </button>
            <button class="btn btn-success" onclick="startContinuousScan()">
                <span>🔄</span> Continuous Scan
            </button>
            <button class="btn btn-danger" onclick="stopContinuousScan()">
                <span>⏹️</span> Stop Scan
            </button>
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <div class="panel-title">
                    <span>📱</span> Connected Devices
                </div>
                <div id="connectedDevices">
                    <div class="loading">Loading connected devices...</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span>🔗</span> Paired Devices
                </div>
                <div id="pairedDevices">
                    <div class="loading">Loading paired devices...</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span>📊</span> Scan History
                </div>
                <div class="history-panel" id="scanHistory">
                    <div class="loading">Loading scan history...</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span>📝</span> Recent Logs
                </div>
                <div class="history-panel" id="recentLogs">
                    <div class="loading">Loading logs...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isScanning = false;

        async function scanDevices() {
            try {
                const response = await fetch('/api/scan');
                const data = await response.json();

                if (data.success) {
                    updateDashboard(data);
                    updateStats();
                    loadHistory();
                    loadLogs();
                }
            } catch (error) {
                console.error('Scan error:', error);
            }
        }

        async function startContinuousScan() {
            try {
                const response = await fetch('/api/start_continuous');
                const data = await response.json();

                if (data.success) {
                    isScanning = true;
                    alert('Continuous scan started');
                }
            } catch (error) {
                console.error('Start continuous error:', error);
            }
        }

        async function stopContinuousScan() {
            try {
                const response = await fetch('/api/stop_continuous');
                const data = await response.json();

                if (data.success) {
                    isScanning = false;
                    alert('Continuous scan stopped');
                }
            } catch (error) {
                console.error('Stop continuous error:', error);
            }
        }

        function updateDashboard(data) {
            // Update connected devices
            const connectedContainer = document.getElementById('connectedDevices');
            const connectedDevices = Object.values(data.connected_devices);

            if (connectedDevices.length === 0) {
                connectedContainer.innerHTML = `
                    <div class="no-data">
                        <div style="font-size: 3em; opacity: 0.3; margin-bottom: 20px;">🎧</div>
                        <p>No connected devices found</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">
                            Connect your Bluetooth devices to see them here
                        </p>
                    </div>
                `;
            } else {
                let html = `
                    <table class="device-table">
                        <thead>
                            <tr>
                                <th>Device</th>
                                <th>Address</th>
                                <th>Type</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                connectedDevices.forEach(device => {
                    html += `
                        <tr>
                            <td>
                                <div style="font-weight: bold;">${device.name}</div>
                                <div style="font-size: 0.9em; opacity: 0.7;">${device.last_seen}</div>
                            </td>
                            <td class="device-address">${device.address}</td>
                            <td>
                                <span class="device-type-icon">${getDeviceIcon(device.type)}</span>
                                ${device.type}
                            </td>
                            <td>
                                <span class="status-badge status-connected">CONNECTED</span>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                connectedContainer.innerHTML = html;
            }

            // Update paired devices
            const pairedContainer = document.getElementById('pairedDevices');
            const pairedDevices = Object.values(data.paired_devices);

            if (pairedDevices.length === 0) {
                pairedContainer.innerHTML = `
                    <div class="no-data">
                        <div style="font-size: 3em; opacity: 0.3; margin-bottom: 20px;">🔗</div>
                        <p>No paired devices found</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">
                            Pair Bluetooth devices in Windows Settings
                        </p>
                    </div>
                `;
            } else {
                let html = `
                    <table class="device-table">
                        <thead>
                            <tr>
                                <th>Device</th>
                                <th>Address</th>
                                <th>Type</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                pairedDevices.forEach(device => {
                    const status = device.is_connected ? 'CONNECTED' : 'PAIRED';
                    const statusClass = device.is_connected ? 'status-connected' : 'status-paired';

                    html += `
                        <tr>
                            <td>
                                <div style="font-weight: bold;">${device.name}</div>
                                <div style="font-size: 0.9em; opacity: 0.7;">${device.last_seen}</div>
                            </td>
                            <td class="device-address">${device.address}</td>
                            <td>
                                <span class="device-type-icon">${getDeviceIcon(device.type)}</span>
                                ${device.type}
                            </td>
                            <td>
                                <span class="status-badge ${statusClass}">${status}</span>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                pairedContainer.innerHTML = html;
            }
        }

        function getDeviceIcon(type) {
            const icons = {
                'Headphones': '🎧',
                'Wearable': '⌚',
                'Phone': '📱',
                'Speaker': '🔊',
                'Peripheral': '🖱️',
                'Computer': '💻',
                'Unknown': '📲'
            };
            return icons[type] || '📲';
        }

        async function updateStats() {
            try {
                const response = await fetch('/api/scan');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('connectedCount').textContent = data.stats.connected_count;
                    document.getElementById('pairedCount').textContent = data.stats.paired_count;
                }
            } catch (error) {
                console.error('Stats error:', error);
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                if (data.success) {
                    const container = document.getElementById('scanHistory');
                    let html = '';

                    data.history.slice(-10).reverse().forEach(scan => {
                        const time = new Date(scan.timestamp).toLocaleString();
                        html += `
                            <div class="history-item">
                                <div class="history-time">${time}</div>
                                <div>Connected: ${scan.connected_count} | Paired: ${scan.paired_count}</div>
                            </div>
                        `;
                    });

                    container.innerHTML = html || '<div class="no-data">No scan history</div>';
                }
            } catch (error) {
                console.error('History error:', error);
            }
        }

        async function loadLogs() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();

                if (data.success) {
                    const container = document.getElementById('recentLogs');
                    let html = '';

                    data.logs.slice(-10).reverse().forEach(log => {
                        html += `
                            <div class="history-item" style="font-family: monospace; font-size: 0.9em;">
                                ${log.trim()}
                            </div>
                        `;
                    });

                    container.innerHTML = html || '<div class="no-data">No logs available</div>';
                }
            } catch (error) {
                console.error('Logs error:', error);
            }
        }

        async function loadSystemInfo() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('systemName').textContent =
                        data.status.system.substring(0, 3).toUpperCase();
                    document.getElementById('totalScans').textContent = data.status.total_scans;

                    if (data.status.scanning) {
                        isScanning = true;
                    }
                }
            } catch (error) {
                console.error('Status error:', error);
            }
        }

        // Initialize dashboard
        window.addEventListener('load', () => {
            loadSystemInfo();
            scanDevices();
            loadHistory();
            loadLogs();

            // Auto-refresh every 10 seconds
            setInterval(() => {
                if (!isScanning) {
                    scanDevices();
                }
            }, 10000);
        });
    </script>
</body>
</html>
